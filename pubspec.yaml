name: e_tools
description: A modular, tablet-first universal toolbox built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^6.0.7
  crypto: ^3.0.8
  device_info_plus: ^12.4.0
  battery_plus: ^7.1.2
  sensors_plus: ^7.1.1
  qr_flutter: ^4.1.0
  file_picker: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.25.2
  build_runner: ^2.4.15
  mocktail: ^1.0.4

# sqlite3 3.9.0 ships a broken prebuilt native asset (hash mismatch on the
# Linux .so), which breaks `flutter test` in CI. Pin to 3.8.0 until fixed.
dependency_overrides:
  sqlite3: 3.8.0
  # file_picker 13 needs win32 6 (via windows_file_picker); the app builds
  # Android only, so win32 6 is safe here.
  win32: ^6.3.0

flutter:
  uses-material-design: true
